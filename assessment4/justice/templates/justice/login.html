<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Youth Justice System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f1e35;
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --border: #e2e8f0;
            --surface: #f4f6f9;
            --text-muted: #64748b;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-banner {
            background: var(--navy);
            border-bottom: 3px solid var(--gold);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .login-badge {
            width: 40px; height: 40px;
            background: var(--gold);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 700; color: var(--navy);
        }
        .login-banner-text .dept {
            font-size: 11px; color: var(--gold-light);
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        .login-banner-text .system {
            font-size: 15px; font-weight: 600; color: white;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .login-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .login-card-header {
            background: var(--navy);
            color: white;
            padding: 20px 28px;
            text-align: center;
        }
        .login-card-header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }
        .login-card-header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }
        .login-card-body { padding: 28px; }
        .form-label { font-weight: 500; font-size: 14px; }
        .form-control {
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            padding: 10px 12px;
        }
        .form-control:focus {
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(15,30,53,0.1);
        }
        .btn-login {
            width: 100%;
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s;
        }
        .btn-login:hover { background: #1a2e4a; }
        .login-footer {
            background: var(--navy);
            color: rgba(255,255,255,0.4);
            text-align: center;
            font-size: 12px;
            padding: 14px;
        }
    </style>
</head>
<body>

<div class="login-banner">
    <div class="login-badge">YJ</div>
    <div class="login-banner-text">
        <div class="dept">HIT237 — Group 7 Project</div>
        <div class="system">Youth Justice Case Management System</div>
    </div>
</div>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-card-header">
            <h2><i class="bi bi-lock-fill me-2"></i>Staff Login</h2>
            <p>Sign in with your account credentials</p>
        </div>
        <div class="login-card-body">
            {% if form.errors %}
                <div style="background:#fef2f2; color:#dc2626; border:1px solid #fecaca; border-radius:6px; padding:10px 14px; font-size:13px; margin-bottom:16px;">
                    <i class="bi bi-exclamation-circle me-1"></i> Invalid username or password.
                </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                </button>
            </form>
        </div>
    </div>
</div>

<div class="login-footer">
    Youth Justice Case Management System &nbsp;·&nbsp; HIT237 Group 7 &nbsp;·&nbsp; Charles Darwin University
</div>

</body>
</html>
